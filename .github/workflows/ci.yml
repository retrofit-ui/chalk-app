name: CI

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm build:artifact
      # Claude artifacts must be a single document under 16 MiB.
      - name: Check artifact build
        run: |
          set -eu
          test "$(ls dist-artifact | wc -l)" -eq 1
          size=$(stat -c%s dist-artifact/chalk.html)
          echo "dist-artifact/chalk.html is $size bytes"
          test "$size" -lt 16777216
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }} # no artifact server under the local `act -j ci` pre-push hook
        with:
          name: chalk-artifact
          path: dist-artifact/chalk.html
          retention-days: 30

  # Separate job so the pre-push `act -j ci` hook stays browser-free.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # e2e/artifact.spec.ts drives the built single-file artifact; it skips itself without this.
      - run: pnpm build:artifact
      - run: pnpm test:e2e
        env:
          CI: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
